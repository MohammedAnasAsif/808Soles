name: Build apps

# Every push to main builds the Android APK and the Windows installer and
# publishes them on the "Latest build" release. Tagging v1.2.3 makes a
# proper versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Documentation-only changes don't need new apps.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Least privilege: jobs can only read the repo, except the release job.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "CADENCE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "CADENCE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "CADENCE_KEY_ALIAS=cadence"
              echo "CADENCE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. The APK is signed with a throwaway key, so it can't update an earlier install. See README."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          ../scripts/ci-run.sh "Android build" ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/808Soles.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soles808-android
          path: out/808Soles.apk

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        shell: bash
        run: scripts/ci-run.sh "Windows build" npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp release/*.exe out/808Soles-Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soles808-windows
          path: out/808Soles-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la out
          cat > notes.md <<EOF
          ## Download 808Soles

          | | |
          | --- | --- |
          | **Android** | Download **808Soles.apk** below on your phone, open it, and allow installing from your browser when asked. |
          | **Windows** | Download **808Soles-Setup.exe** below and run it. If SmartScreen warns, click *More info → Run anyway*. |

          Built from ${GITHUB_SHA:0:7}.
          EOF
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --repo "$REPO" --title "808Soles $GITHUB_REF_NAME" --notes-file notes.md --latest
          else
            gh release delete latest-build --repo "$REPO" --cleanup-tag -y || true
            # A full release marked Latest, so it shows on the repo's front page
            # and /releases/latest/download/<file> links always work.
            gh release create latest-build out/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
              --title "808Soles (latest)" --notes-file notes.md
          fi
